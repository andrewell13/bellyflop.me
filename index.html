<!DOCTYPE html>
<html>
<head>
    <title>bellyflop.me</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, pink, lightblue, orange, purple);
            background-size: 200% 200%;
            animation: gradient 10s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            margin: 0;
            font-size: 100px;
            color: white;
        }
        h2 {
            margin: 0;
            font-size: 50px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Hello World!</h1>
    <h2>by Andrew Ellis</h2>
</body>
</html>
